# Override para hosts con GPU NVIDIA (requiere nvidia-container-toolkit instalado).
#
# Va aparte del compose principal a propósito: si la reserva de GPU estuviera en
# `docker-compose.yml`, el servicio `embeddings` fallaría al arrancar en cualquier máquina
# sin GPU — incluida esta. Así el compose base corre en todas partes y la GPU se pide
# explícitamente:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     --profile embeddings run --rm embeddings
services:
  embeddings:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
