# Milvus standalone (vector DB) + dependencias etcd/minio.
# etcd y minio quedan solo en la red interna; únicamente se exponen los
# puertos de Milvus. Attu (UI web) es opcional: `docker compose --profile ui up`.
name: uindex-milvus

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./docker/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./docker/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: uindex-milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./docker/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC (clientes pymilvus)
      - "9091:9091"     # métricas / health
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Cálculo de embeddings (BETO, Nemotron VL). No arranca con `docker compose up`:
  # es un trabajo puntual, se lanza con
  #     docker compose --profile embeddings run --rm embeddings
  # En un host con GPU, añadir el override: -f docker-compose.yml -f docker-compose.gpu.yml
  embeddings:
    build:
      context: .
      dockerfile: docker/Dockerfile.embeddings
    image: uindex-embeddings:latest
    profiles: ["embeddings"]
    volumes:
      # Lectura del CSV fuente y escritura de data/embeddings/*.npy en el host.
      - ./data:/app/data
      # Los pesos (~3.4 GB) persisten entre ejecuciones en vez de re-descargarse.
      - hf-cache:/cache/huggingface

  # UI opcional para inspeccionar colecciones: http://localhost:8000
  attu:
    image: zilliz/attu:v2.5
    container_name: uindex-attu
    profiles: ["ui"]
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  # Caché de modelos de HuggingFace, compartida por todas las corridas de `embeddings`.
  hf-cache:
